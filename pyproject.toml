[project]
name = "document-ingestion"
version = "0.4.5"
description = "Document intelligence ingestion pipeline (load -> clean -> analyze -> chunk -> embed -> index)."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: full pipeline test with a real embedding model + FAISS (opt-in, run with `-m e2e`)",
]
addopts = "-m 'not e2e'"
