<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1360" height="260" fill="#ffffff"/>

  <!-- Stage boxes -->
  <!-- x positions: 20, 190, 360, 530, 700, 870, 1040, 1210 ; width 150, height 70, y=95 -->

  <g font-size="13" fill="#1a1a1a">
    <!-- File -->
    <rect x="10" y="105" width="120" height="50" rx="8" fill="#eef2f7" stroke="#8aa0b8" stroke-width="1.5"/>
    <text x="70" y="135" text-anchor="middle" font-weight="600">PDF file</text>

    <!-- Load -->
    <rect x="180" y="95" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#4a78c2" stroke-width="1.5"/>
    <text x="255" y="122" text-anchor="middle" font-weight="700">Load</text>
    <text x="255" y="142" text-anchor="middle" font-size="11" fill="#3a3a3a">PDFLoader (pypdf)</text>

    <!-- Clean -->
    <rect x="380" y="95" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#4a78c2" stroke-width="1.5"/>
    <text x="455" y="122" text-anchor="middle" font-weight="700">Clean</text>
    <text x="455" y="142" text-anchor="middle" font-size="11" fill="#3a3a3a">TextCleaner</text>

    <!-- Analyze -->
    <rect x="580" y="95" width="150" height="70" rx="8" fill="#fdf1e0" stroke="#c98a2b" stroke-width="1.5"/>
    <text x="655" y="122" text-anchor="middle" font-weight="700">Analyze</text>
    <text x="655" y="142" text-anchor="middle" font-size="11" fill="#3a3a3a">PDFAnalyzer</text>

    <!-- Chunk -->
    <rect x="780" y="95" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#4a78c2" stroke-width="1.5"/>
    <text x="855" y="122" text-anchor="middle" font-weight="700">Chunk</text>
    <text x="855" y="142" text-anchor="middle" font-size="11" fill="#3a3a3a">HybridChunker</text>

    <!-- Metadata -->
    <rect x="980" y="95" width="150" height="70" rx="8" fill="#e8f0fe" stroke="#4a78c2" stroke-width="1.5"/>
    <text x="1055" y="122" text-anchor="middle" font-weight="700">Metadata</text>
    <text x="1055" y="142" text-anchor="middle" font-size="11" fill="#3a3a3a">MetadataGenerator</text>

    <!-- Embed + Index stacked at far right -->
    <rect x="1180" y="60" width="160" height="60" rx="8" fill="#e6f4ea" stroke="#3a8a55" stroke-width="1.5"/>
    <text x="1260" y="85" text-anchor="middle" font-weight="700">Embed</text>
    <text x="1260" y="103" text-anchor="middle" font-size="11" fill="#3a3a3a">HF embeddings</text>

    <rect x="1180" y="140" width="160" height="60" rx="8" fill="#e6f4ea" stroke="#3a8a55" stroke-width="1.5"/>
    <text x="1260" y="165" text-anchor="middle" font-weight="700">Index</text>
    <text x="1260" y="183" text-anchor="middle" font-size="11" fill="#3a3a3a">FAISSIndexer</text>
  </g>

  <!-- Arrows along the main row -->
  <g stroke="#444" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="130" y1="130" x2="176" y2="130"/>
    <line x1="330" y1="130" x2="376" y2="130"/>
    <line x1="530" y1="130" x2="576" y2="130"/>
    <line x1="730" y1="130" x2="776" y2="130"/>
    <line x1="930" y1="130" x2="976" y2="130"/>
    <line x1="1130" y1="120" x2="1176" y2="95"/>
  </g>
  <line x1="1260" y1="120" x2="1260" y2="136" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Recommendation dashed callout from Analyze to Chunk -->
  <path d="M655,95 C655,40 855,40 855,93" fill="none" stroke="#c98a2b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="755" y="35" text-anchor="middle" font-size="11" fill="#a06a1c">ChunkingRecommendation (strategy, size, overlap)</text>

  <!-- Output -->
  <rect x="1180" y="215" width="160" height="35" rx="6" fill="#f3f3f3" stroke="#888" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="1260" y="237" text-anchor="middle" font-size="11" fill="#333">FAISS index (disk / volume)</text>
  <line x1="1260" y1="200" x2="1260" y2="211" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="10" y="20" font-size="15" font-weight="700" fill="#1a1a1a">Ingestion pipeline — stage flow</text>
</svg>
